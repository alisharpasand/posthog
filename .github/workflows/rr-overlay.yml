name: rr-overlay
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base posthog image"
        required: true
        default: "ghcr.io/posthog/posthog@sha256:9977b77607e45adbc22dc8a40186230f9bdc4b5d03e79eb9da93a17d83feef27"
      tag:
        description: "Output tag"
        required: true
        default: "rr-presigned-put"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rr-overlay.Dockerfile
          build-args: BASE=${{ inputs.base }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alisharpasand/posthog:${{ inputs.tag }}
